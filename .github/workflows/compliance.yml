name: Compliance-Gated Deployment Pipeline

# Manual-only while the AWS OIDC role is being rebuilt; push trigger returns in a later PR.
on:
  workflow_dispatch:

# Tool versions in one place; Dependabot can't bump these, so update them by hand.
env:
  CHECKOV_VERSION: "3.3.30"
  PROWLER_VERSION: "5.45.0"
  OPA_VERSION: "1.21.4"
  OPA_SHA256: "2ab571f367f293bb19523b76f92f1945bbf245003392c7f392903f95c2b9b630"

jobs:
  checks:
    name: Security & Compliance Checks
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::982081090103:role/github-actions-oidc-role
          aws-region: ap-south-1

      - name: Terraform Init
        run: |
          cd terraform
          terraform init

      - name: Terraform Plan
        run: |
          mkdir -p reports
          cd terraform
          terraform plan -out=tfplan.binary
          terraform show -json tfplan.binary > ../reports/tfplan.json

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: |
          python -m pip install "checkov==${CHECKOV_VERSION}"

      - name: Run Checkov scan on Terraform
        run: |
          checkov -d terraform --framework terraform --output json > reports/checkov.json || true

      - name: Show Checkov summary
        run: |
          checkov -d terraform --quiet || true

      - name: Upload compliance reports (artifact)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compliance-reports
          path: reports/

      - name: Generate compliance metadata
        run: |
          DATE=$(date +%F)
          cat <<EOF > reports/metadata.json
          {
            "tool": "checkov",
            "repository": "${GITHUB_REPOSITORY}",
            "commit": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "actor": "${GITHUB_ACTOR}",
            "date": "${DATE}"
          }
          EOF

      - name: Upload Checkov report to S3 (OIDC)
        run: |
          DATE=$(date +%F)
          aws s3 cp reports/checkov.json \
            "s3://compliance-evidence-ayush-982081090103/checkov/${DATE}/checkov.json"

      - name: Upload metadata to S3 (OIDC)
        run: |
          DATE=$(date +%F)
          aws s3 cp reports/metadata.json \
            "s3://compliance-evidence-ayush-982081090103/checkov/${DATE}/metadata.json"

  apply:
    name: Protected Apply (Manual Approval Required)
    needs: checks
    runs-on: ubuntu-latest
    environment: production

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::982081090103:role/github-actions-oidc-role
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5

      - name: Terraform Init
        run: |
          cd terraform
          terraform init

      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply -auto-approve

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Prowler and collector dependencies
        run: |
          python -m pip install "prowler==${PROWLER_VERSION}" -r requirements.txt

      - name: Run Prowler (post-deployment audit)
        run: |
          mkdir -p reports/prowler
          prowler aws \
          --region ap-south-1 \
          --output-formats json-ocsf \
          --output-directory reports/prowler \
          || true

      - name: Generate Prowler metadata
        run: |
          DATE=$(date +%F)
          cat <<EOF > reports/prowler/metadata.json
          {
            "tool": "prowler",
            "repository": "${GITHUB_REPOSITORY}",
            "commit": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "actor": "${GITHUB_ACTOR}",
            "date": "${DATE}",
            "trigger": "post-deployment"
          }
          EOF

      - name: Upload Prowler report to S3 (OIDC)
        run: |
          DATE=$(date +%F)
          aws s3 sync reports/prowler \
            "s3://compliance-evidence-ayush-982081090103/prowler/${DATE}/"

      - name: Install OPA (pinned + checksum-verified)
        run: |
          curl -fsSL -o opa \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          echo "${OPA_SHA256}  opa" | sha256sum --check
          chmod +x opa
          sudo mv opa /usr/local/bin/opa

      - name: Generate OPA input from AWS (Boto3)
        run: |
          mkdir -p reports/opa
          python scripts/boto_opa_stream.py --environment prod

      - name: Run OPA policy evaluation
        run: |
          opa eval \
            -i reports/opa/input.json \
            -d policies \
            "data.compliance.ec2.deny" \
            > reports/opa/decision.json || true

      - name: Upload OPA decision to S3 (OIDC)
        run: |
          DATE=$(date +%F)
          aws s3 cp reports/opa/decision.json \
            "s3://compliance-evidence-ayush-982081090103/opa/${DATE}/decision.json"
