# Local mirror of .github/workflows/ci.yml. Install once: pre-commit install
# Run on everything: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-docker

  - repo: local
    hooks:
      - id: terraform-fmt
        name: terraform fmt
        language: system
        entry: terraform fmt
        files: \.tf$
      - id: tflint
        name: tflint
        language: docker_image
        entry: ghcr.io/terraform-linters/tflint:v0.65.0 --chdir=terraform
        files: ^terraform/
        pass_filenames: false
      - id: opa-fmt
        name: opa fmt
        language: system
        entry: opa fmt -w
        files: \.rego$
      - id: opa-check
        name: opa check --strict
        language: system
        entry: opa check --strict policies
        files: \.rego$
        pass_filenames: false
